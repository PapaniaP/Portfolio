<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Paolo Papania - Frontend Developer and UX/UI Designer showcasing creative web development projects"
    />

    <!-- Open Graph / Social Media -->
    <meta
      property="og:title"
      content="Paolo Papania | Portfolio"
    />
    <meta
      property="og:description"
      content="Frontend Developer and UX/UI Designer"
    />
    <meta
      property="og:image"
      content="/src/assets/Images/avatar.png"
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- Preload Critical Resources -->
    <link
      rel="preload"
      href="/src/css/style.css"
      as="style"
    />
    <link
      rel="preload"
      href="/src/js/main.js"
      as="script"
    />

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/src/assets/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/src/assets/favicon_io/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="/src/assets/favicon_io/site.webmanifest"
    />

    <!-- Styles -->
    <link
      rel="stylesheet"
      href="/src/css/style.css"
    />

    <!-- Modern fonts (system fonts for better performance) -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    </style>

    <title>Paolo Papania | Portfolio</title>
  </head>
  <body>
    <!-- Skip to main content link for accessibility -->
    <a
      href="#main-content"
      class="skip-link"
      >Skip to main content</a
    >

    <header class="site-header">
      <nav
        class="main-nav"
        aria-label="Main navigation"
      >
        <a
          href="/"
          class="logo"
          aria-label="Home"
        >
          <img
            src="/src/assets/Logo/Key_P_Logo.png"
            alt="Paolo Papania Logo"
            width="40"
            height="40"
          />
        </a>
        <button
          class="menu-toggle"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          <span class="menu-icon"></span>
        </button>
        <ul class="nav-links">
          <li>
            <a
              href="/"
              class="active"
              >Home</a
            >
          </li>
          <li><a href="/about">About</a></li>
          <li><a href="/projects">Projects</a></li>
          <li>
            <a
              href="/src/assets/cv_papaniap.pdf"
              target="_blank"
              rel="noopener noreferrer"
              >CV</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main
      id="main-content"
      class="main-content"
    >
      <section class="hero">
        <h1 class="hero-title">Paolo Papania</h1>
        <p class="hero-subtitle">
          Frontend Developer & UX/UI Designer
        </p>
        <a
          href="#work"
          class="cta-button"
          >View My Work</a
        >
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="social-links">
          <a
            href="https://github.com/PapaniaP"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub Profile"
          >
            <svg
              class="icon github-icon"
              aria-hidden="true"
            ></svg>
          </a>
          <a
            href="mailto:papaniap11@gmail.com"
            aria-label="Email Contact"
          >
            <svg
              class="icon email-icon"
              aria-hidden="true"
            ></svg>
          </a>
          <a
            href="https://linkedin.com/in/paolo-papania"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn Profile"
          >
            <svg
              class="icon linkedin-icon"
              aria-hidden="true"
            ></svg>
          </a>
        </div>
        <p class="copyright">&copy; 2024 Paolo Papania</p>
      </div>
    </footer>

    <!-- Modern JavaScript with type="module" -->
    <script
      type="module"
      src="/src/js/main.js"
    ></script>
  </body>
</html>
