name: Deploy to Simply.com via Web Deploy

on:
  push:
    branches:
      - feature/astro-migration # Or your default branch

jobs:
  build_and_deploy:
    name: Build and Deploy Website
    runs-on: windows-latest # Required by the Web Deploy action

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Specify your Node.js version, adjust if needed
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build
        # If your build needs environment variables, add them here:
        # env:
        #   PUBLIC_URL: '/' # Example environment variable

      - name: Deploy to Simply.com
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\dist\' # Path to built files (use backslashes on Windows)
          # target-path: '/sub-directory/' # Optional: Deploy to a subdirectory within the website root
          target-delete: true # Delete files on the server that are not in the source path
