name: Deploy to Simply.com

on:
  push:
    branches:
      - feature/astro-migration # Or your default branch (e.g., master)

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the user's home directory (optional, adjust if needed)
            cd /home/${{ secrets.SSH_USER }}

            # Check if the repository directory exists
            if [ ! -d "repo" ] ; then
              echo "Cloning repository..."
              # Clone the repository using the deploy key
              git clone git@github.com:${{ github.repository }}.git repo
              cd repo
            else
              echo "Repository exists, pulling changes..."
              cd repo
              # Ensure we are on the correct branch and reset if needed
              git fetch origin
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              git pull origin ${{ github.ref_name }}
            fi

            echo "Installing dependencies..."
            npm install

            echo "Building website..."
            npm run build

            echo "Deploying build files to public_html..."
            # Assumes public_html is /home/user/public_html. Adjust target path if needed.
            # The trailing slash on ./dist/ is important!
            # --delete flag removes files from public_html that are not in dist
            rsync -avz --delete ./dist/ /home/${{ secrets.SSH_USER }}/public_html/

            echo "Deployment complete!"
