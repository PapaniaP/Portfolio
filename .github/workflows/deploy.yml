name: Deploy to Simply.com via FTP

on:
  push:
    branches:
      - feature/astro-migration # Or your default branch

jobs:
  build_and_deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest # Switch back to ubuntu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        # If your build needs environment variables, add them here:
        # env:
        #   PUBLIC_URL: '/' # Example environment variable

      - name: Deploy to Simply.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5 # Use a specific version
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # port: 21 # Optional: Default is 21
          local-dir: ./dist/ # Path to the built files (note the trailing slash)
          server-dir: /public_html/ # Target directory on server
          # Optional: Recommended settings
          dangerous-clean-slate: true # Deletes existing files on the server not in local-dir
          timeout: 30000 # Increase timeout to 30 seconds
