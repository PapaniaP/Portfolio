name: Check portfolio draft

on:
  push:
    branches: [portfolio-sept-2026]
  pull_request:
    branches: [feature/astro-migration]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
